services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3001
    command: node --watch server.js
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app/backend
      - ./src/data:/app/src/data:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api
