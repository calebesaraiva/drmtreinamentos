name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deploy archive
        run: |
          ARCHIVE_PATH="drm-deploy.tar.gz"
          rm -f "$ARCHIVE_PATH"
          tar -czf "$ARCHIVE_PATH" \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude drm-deploy.tar.gz \
            --exclude tmp-cert-tests \
            .

      - name: Upload archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "drm-deploy.tar.gz"
          target: "/tmp"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/drm-treinamentos"
            fi

            mkdir -p "$DEPLOY_PATH"
            tar -xzf /tmp/drm-deploy.tar.gz -C "$DEPLOY_PATH"

            cd "$DEPLOY_PATH"
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            docker compose -f docker-compose.prod.yml ps
            docker exec drm-treinamentos-frontend-1 sh -c "cat /usr/share/nginx/html/index.html | head -n 20"
